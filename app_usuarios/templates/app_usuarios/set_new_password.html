{% extends 'base.html' %}
{% block title %}Nueva contraseña | MH’ELEGANZA{% endblock %}
{% block content %}
<main class="container py-5">
    <div class="mx-auto card shadow border-0 rounded-4 p-4" style="max-width: 540px;">
        <h1 class="h4 fw-bold">Define una nueva contraseña</h1>
        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <label class="form-label" for="password_nueva">Nueva contraseña</label>
            <input class="form-control mb-3" id="password_nueva" name="password_nueva" type="password" autocomplete="new-password" required>
            <label class="form-label" for="password_confirmacion">Confirma la contraseña</label>
            <input class="form-control mb-3" id="password_confirmacion" name="password_confirmacion" type="password" autocomplete="new-password" required>
            <button class="btn btn-dark rounded-pill w-100" type="submit">Actualizar contraseña</button>
        </form>
    </div>
</main>
{% endblock %}
