{% extends 'base.html' %}
{% block title %}Verificar código | MH’ELEGANZA{% endblock %}
{% block content %}
<main class="container py-5">
    <div class="mx-auto card shadow border-0 rounded-4 p-4" style="max-width: 540px;">
        <h1 class="h4 fw-bold">Verifica tu teléfono</h1>
        <p class="text-muted">Ingresa el código de seis dígitos recibido por SMS.</p>
        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <label class="form-label" for="codigo">Código</label>
            <input class="form-control mb-3" id="codigo" name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
            <button class="btn btn-dark rounded-pill w-100" type="submit">Verificar código</button>
        </form>
    </div>
</main>
{% endblock %}
