{% extends 'base.html' %}
{% block body_class %}profile-page{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Actualizar Dirección de Envío</h3>
                <p class="text-muted small">Ingresa la dirección donde recibirás tus pedidos de MH’ELEGANZA</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="direccion" class="form-label fw-semibold small">Dirección Completa / Ciudad</label>
                    <textarea class="form-control rounded-4 px-3 py-2" id="direccion" name="direccion" rows="3" placeholder="Ej: Calle Principal # 12-34, Barrio Centro" required>{{ direccion_actual }}</textarea>
                </div>
                <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-semibold shadow-sm mt-2">Actualizar Dirección</button>
            </form>

            <div class="text-center mt-4 small">
                <a href="{% url 'perfil_datos' %}" class="text-secondary text-decoration-none fw-semibold">← Volver al Perfil</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
